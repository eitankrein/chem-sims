<style>
/* Layout: a lab notebook — tab strip of the experiment's stages; each part = bench + datalogger beside the protocol */

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp div{background:var(--accent-soft);border-radius:8px;padding:8px;text-align:center;display:flex;flex-direction:column}.cmp span{font-size:.85rem;color:var(--muted)}.cmp b{font-size:1.3rem}

details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}

.bench{grid-template-columns:minmax(0,1fr) 190px}

function tabDone(id){
  if(id==='intro')return !!(S.name.trim());

  if(id==='calc')return S.calcOk.A&&S.calcOk.B;
  if(id==='hess')return S.hess.ok;
  if(id==='disc')return QS.every((_,i)=>(S.disc[i]||'').trim().length>0);
  return false;
}

  const lab=`t = ${best[0]} s   T = ${best[1].toFixed(2)} °C`;c.font='12px "IBM Plex Mono", monospace';const tw=c.measureText(lab).width+12;let bx=Math.min(Math.max(x-tw/2,L),W-R-tw);

/* ---------- simulation ---------- */
let last=null;
function noise(){return (Math.random()+Math.random()+Math.random()-1.5)*0.02}
function heatCap(p){return p.mw*MODEL.cpW+p.Csalt+p.Ccup}
function stepSim(k,dt){const p=S.parts[k];const h=0.1;const C=heatCap(p);const kl=(p.lid&&!(p.added&&p.t<p.tAdd+MODEL.tOpen))?MODEL.kLid:MODEL.kOpen;
 p.acc+=dt;
 while(p.acc>=h){p.acc-=h;p.t=+(p.t+h).toFixed(1);
  let rate=0;if(p.added){rate=(p.Qtot-p.Qrel)/(p.tau*(p.stir?1:MODEL.noStir));p.Qrel+=rate*h}
  p.Tw+=rate*h/C-kl*(p.Tw-p.room)*h;
  p.Ts+=(p.Tw-p.Ts)*h/3;
  if(p.added){const up=p.Qtot>0;if(p.ext==null||(up?p.Ts>p.ext:p.Ts<p.ext)){p.ext=p.Ts;p.tExt=p.t}}
  if(Math.abs(p.t-Math.round(p.t))<1e-6){const r=+(p.Ts+noise()).toFixed(2);p.data.push([Math.round(p.t),r])}
 }
}
function tick(ts){
 const k=S.tab;if(PARTS[k]){const p=S.parts[k];
  if(last!=null&&p.running){const dt=Math.min(0.1,(ts-last)/1000)*S.speed;stepSim(k,dt);if(p.t>900){p.running=false;p.stopped=true}}
  updateLogger(k);updateLive(k);if(p.running)drawChart(k);
  if(p.running&&ts-(window._sv||0)>2000){window._sv=ts;save()}
  if(p.running&&p.added&&ts-(window._bt||0)>250){window._bt=ts;const g=$('#crys');if(g)g.innerHTML=crystalsHTML(k);const fl=$('#flow');if(fl)fl.innerHTML=flowHTML(k);const ld=$('#lidG');if(ld)ld.setAttribute('transform',p.t<p.tAdd+MODEL.tOpen?'translate(0,-18)':'')}
 }
 last=ts;requestAnimationFrame(tick);
}
function updateLogger(k){const p=S.parts[k];const T=$('#lgT');if(!T)return;
 const lastR=p.data.length?p.data[p.data.length-1][1]:null;
 T.textContent=p.running||p.stopped?(lastR!=null?lastR.toFixed(2):p.Ts.toFixed(2))+' °C':'--.- °C';
 $('#lgt').textContent=Math.round(p.t)+' s';
 const dkT=$('#dkT');if(dkT)dkT.textContent=T.textContent;
 $('#lgState').textContent=p.running?'● מודד':(p.stopped?'המדידה נעצרה':'ממתין');
}
requestAnimationFrame(tick);

/* ---------- Hess ---------- */
function dhv(k){return num(S.calc[k].dh)}
function eqLine(which,dir,strike){
 const fwd=dir==='fwd';

 if(which==='1')return fwd?`MgSO<sub>4(s)</sub> → ${ions}`:`${ions} → MgSO<sub>4(s)</sub>`;
 return fwd?`MgSO<sub>4</sub>·7H<sub>2</sub>O<sub>(s)</sub> → ${ions} + 7H<sub>2</sub>O<sub>(l)</sub>`:`${ions} + 7H<sub>2</sub>O<sub>(l)</sub> → MgSO<sub>4</sub>·7H<sub>2</sub>O<sub>(s)</sub>`;
}
const SPEC=[['anh','MgSO<sub>4(s)</sub>','MgSO4(s)'],['mg','Mg<sup>2+</sup><sub>(aq)</sub>','Mg2+(aq)'],['so4','SO<sub>4</sub><sup>2−</sup><sub>(aq)</sub>','SO4 2−(aq)'],['w','7H<sub>2</sub>O<sub>(l)</sub>','7H2O(l)'],['hyd','MgSO<sub>4</sub>·7H<sub>2</sub>O<sub>(s)</sub>','MgSO4·7H2O(s)']];
function knownDH(k){const nm=k==='A'?'ΔH<sub>1</sub>':'ΔH<sub>2</sub>';if(!tabDone('calc'))return nm+' = ?';return `${nm} = ${fmtS(dhv(k))} kJ/mol`}
function dirDH(k,dir){if(dir==='fwd')return knownDH(k);
if(S.hess.revOk)return `−${k==='A'?'ΔH<sub>1</sub>':'ΔH<sub>2</sub>'} = ${fmtS(-dhv(k))} kJ/mol`;

const EXPR=[['a','ΔH<sub>1</sub> + (−ΔH<sub>2</sub>)'],['b','ΔH<sub>1</sub> + ΔH<sub>2</sub>'],['c','ΔH<sub>2</sub> − ΔH<sub>1</sub>'],['d','−ΔH<sub>1</sub> − ΔH<sub>2</sub>']];
function hessHTML(){const h=S.hess;h.cancel=h.cancel||[];const ready=tabDone('calc');
 const good=h.d1==='fwd'&&h.d2==='rev';const strike=good&&h.cancelOk;
 const dirChips=(key,cur)=>['fwd','rev'].map(d=>`<button class="chip" data-dir="${key}:${d}" aria-pressed="${cur===d}" ${h.revOk?'disabled':''}>${d==='fwd'?'כמו שהיא':'הפוכה'}</button>`).join('');
 const fb=h.fb||{};
 const inp=(f,dis)=>`<input type="number" step="any" inputmode="decimal" id="h_${f}" value="${esc(h[f]||'')}" ${dis?'disabled':''} style="width:8em;direction:ltr;text-align:center"> <span class="f">kJ/mol</span> <span class="fb ${fb[f]&&fb[f][0]?'good':'badc'}" style="display:inline">${fb[f]?fb[f][1]:''}</span>`;
 let fbDir='';
 if(h.d1&&h.d2&&!good){
  if(h.d1!=='fwd')fbDir='<div class="msg bad" style="margin-top:8px">בתגובה המבוקשת '+F.anhs+' הוא מגיב. באיזה כיוון של תגובה (1) הוא נמצא בצד המגיבים?</div>';
  else fbDir='<div class="msg bad" style="margin-top:8px">בתגובה המבוקשת '+F.hyds+' הוא תוצר. באיזה כיוון של תגובה (2) הוא נמצא בצד התוצרים?</div>';}
 let s=`<div class="panel"><div class="card"><h2>חוק הס: חישוב אנתלפיית ההידרציה</h2>
 <p style="margin-top:8px">שתי ההמסות הסתיימו באותה תמיסה: אותה כמות יונים באותה כמות מים. אלה התגובות הידועות, עם הערכים שחישבתם, ומתחתן התגובה המבוקשת:</p>
 <div class="eqs known" style="margin-top:10px">

  <div class="eqr sum"><b>מבוקשת</b><span class="f"><span class="nb">${EQ.hyd}</span> <span class="nb dh">ΔH<sub>hyd</sub> = ?</span></span></div>
 </div>
 ${ready?'':'<p class="hint" style="margin-top:6px">הערכים יופיעו כאן אחרי שתשלימו את טבלת החישובים.</p>'}
 <h3 style="margin-top:16px">שלב 1 – הפיכה</h3>
 <p style="margin-top:6px">את התגובה המבוקשת מרכיבים מחיבור התגובות הידועות. בחרו לכל תגובה אם להשתמש בה כמו שהיא או הפוכה. בתגובה הפוכה המגיבים הופכים לתוצרים והתוצרים למגיבים.</p>
 <div class="eqs" style="margin-top:10px">
  <div class="eqr"><b>תגובה (1)</b><span class="btns">${dirChips('d1',h.d1)}</span></div>
  ${h.d1?`<div class="eqr"><span></span><span class="f"><span class="nb">${eqLine('1',h.d1,false)}</span> <span class="nb dh">${dirDH('A',h.d1)}</span></span></div>`:''}
  <div class="eqr"><b>תגובה (2)</b><span class="btns">${dirChips('d2',h.d2)}</span></div>
  ${h.d2?`<div class="eqr"><span></span><span class="f"><span class="nb">${eqLine('2',h.d2,false)}</span> <span class="nb dh">${dirDH('B',h.d2)}</span></span></div>`:''}
 </div>
 ${good?'<div class="msg ok" style="margin-top:8px">הכיוונים נכונים: את תגובה (2) הופכים. נקרא לתגובה ההפוכה <span class="f">(2*)</span>.</div>':fbDir}
 ${good&&ready?`<div class="reqs" style="margin-top:10px"><div><span class="f">ΔH</span> של תגובה <span class="f">(2*)</span> = ${inp('rev',h.revOk)}</div></div>
  ${h.revOk?'<div class="msg ok" style="margin-top:8px">נכון. כשהופכים תגובה, הסימן של <span class="f">ΔH</span> שלה מתהפך: <span class="f">ΔH = −ΔH<sub>2</sub></span>.</div>':'<div class="btns" style="margin-top:10px"><button class="b" id="checkRev">בדיקה</button></div>'}`:''}
 </div>`;
 if(!good||(ready&&!h.revOk))return s+'</div>';
 s+=`<div class="card"><h3>שלב 2 – חיבור וצמצום</h3>
 <p style="margin-top:6px">מחברים את תגובה (1) ואת תגובה <span class="f">(2*)</span>. אילו חלקיקים מופיעים בשני האגפים של הסכום ומצטמצמים? סמנו את כולם.</p>
 <div class="eqs" style="margin-top:10px">
  <div class="eqr"><b>(1)</b><span class="f"><span class="nb">${eqLine('1','fwd',strike)}</span> <span class="nb dh">${dirDH('A','fwd')}</span></span></div>
  <div class="eqr"><b><span class="f">(2*)</span></b><span class="f"><span class="nb">${eqLine('2','rev',strike)}</span> <span class="nb dh">${dirDH('B','rev')}</span></span></div>
  ${strike?`<div class="eqr sum"><b><span class="f">(1)+(2*)</span></b><span class="f"><b>${EQ.hyd}</b></span></div>`:''}
 </div>
 <div class="species" style="margin-top:8px">${SPEC.map(([id,l])=>`<button class="chip" data-sp="${id}" aria-pressed="${h.cancel.includes(id)}" ${h.cancelOk?'disabled':''}><span class="f">${l}</span></button>`).join('')}</div>
 ${h.cancelOk?'<div class="msg ok" style="margin-top:8px">נכון. היונים <span class="f">Mg<sup>2+</sup><sub>(aq)</sub></span> ו־<span class="f">SO<sub>4</sub><sup>2−</sup><sub>(aq)</sub></span> נוצרים בתגובה (1) ומגיבים בתגובה <span class="f">(2*)</span>, ולכן הם מצטמצמים. הסכום הוא תגובת יצירת ההידראט.</div>':`<div class="btns" style="margin-top:10px"><button class="b" id="checkCancel">בדיקה</button></div>${h.fbCancel?`<div class="msg bad" style="margin-top:8px">${h.fbCancel}</div>`:''}`}
 </div>`;
 if(!strike)return s+'</div>';
 if(!ready)return s+`<div class="card"><p class="hint">כדי לחשב את <span class="f">ΔH<sub>hyd</sub></span>, השלימו קודם את טבלת החישובים.</p></div></div>`;
 s+=`<div class="card"><h3>שלב 3 – הקשר בין שינויי האנתלפיה</h3>
 <p style="margin-top:8px">רק עכשיו, אחרי ההרכבה, בחרו איך מחשבים את <span class="f">ΔH<sub>hyd</sub></span> באמצעות <span class="f">ΔH<sub>1</sub></span> ו־<span class="f">ΔH<sub>2</sub></span>, וחשבו את הערך.</p>
 <div class="btns" style="margin-top:8px">${EXPR.map(([id,l])=>`<button class="chip" data-expr="${id}" aria-pressed="${h.expr===id}" ${h.ok?'disabled':''}><span class="f">ΔH<sub>hyd</sub> = ${l}</span></button>`).join('')}</div>
 ${fb.expr&&!fb.expr[0]?`<div class="msg bad" style="margin-top:8px">${fb.expr[1]}</div>`:''}
 <div class="reqs" style="margin-top:10px"><div><span class="f">ΔH<sub>hyd</sub></span> = ${inp('val',h.ok)}</div></div>
 ${h.ok?`<div class="msg ok" style="margin-top:10px">נכון. לפי התוצאות שלכם <span class="f">ΔH<sub>hyd</sub> = ${fmtS(dhv('A'))} + (${fmtS(-dhv('B'))}) = ${hydVal().toFixed(1)} kJ/mol</span>.</div>`:'<div class="btns" style="margin-top:12px"><button class="b" id="checkHess">בדיקה</button></div>'}
 </div>`;
 if(!h.ok)return s+'</div>';
 s+=`<div class="card"><h3 id="diag">שלב 4 – תרשים רמות אנתלפיה</h3>
 <p style="margin-top:8px">ליד כל חץ מופיע ערך <span class="f">ΔH</span> שקיבלתם. בדקו שהמעבר הישיר מהרמה העליונה אל התחתונה שווה למעבר דרך הרמה האמצעית.</p>
 <div style="overflow-x:auto;margin-top:8px">${enthalpySVG()}</div>
 <p class="hint" style="margin-top:6px">שני המסלולים מתחילים באותו מצב ומסתיימים באותו מצב, ולכן שינוי האנתלפיה הכולל שלהם זהה:</p>
 <div class="eq" style="margin-top:6px">ΔH<sub>1</sub> + (−ΔH<sub>2</sub>) = ${fmtS(dhv('A'))} + (${fmtS(-dhv('B'))}) = ${hydVal().toFixed(1)} kJ/mol = ΔH<sub>hyd</sub></div>
 <div class="stack" style="margin-top:14px"><button class="b go" id="toDisc">המשך לשאלות הדיון ←</button><button class="b alt" id="toExt">להרחבה (רשות): מלח שקלט לחות</button></div>
 </div></div>`;
 return s}
function hydVal(){return dhv('A')-dhv('B')}
function enthalpySVG(){const a=dhv('A'),b=dhv('B'),c=a-b;const W=600,H=330,top=40,bot=262;
 const lo=Math.min(0,a,c),hi=0;const Y=v=>top+(bot-top)*(hi-v)/(hi-lo||1);
 const ink='var(--ink)',mut='var(--muted)',acc='var(--accent)',wrn='var(--warn)';
 const line=(x1,x2,v)=>`<line x1="${x1}" x2="${x2}" y1="${Y(v)}" y2="${Y(v)}" stroke="${ink}" stroke-width="3"/>`;
 const lab=(x,y,t,anchor)=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="12" fill="${ink}">${t}</text>`;
 const arr=(x,v1,v2,t,col,side)=>{const y1=Y(v1),y2=Y(v2);return `<line x1="${x}" x2="${x}" y1="${y1}" y2="${y2-7}" stroke="${col}" stroke-width="2.5"/><path d="M${x-6} ${y2-9} L${x} ${y2} L${x+6} ${y2-9}" fill="${col}"/><text x="${side>0?x+8:x-8}" y="${(y1+y2)/2+4}" text-anchor="${side>0?'start':'end'}" font-size="12" fill="${col}" style="font-family:'IBM Plex Mono',monospace">${t}</text>`};
 return `<svg viewBox="0 0 ${W} ${H}" style="direction:ltr;unicode-bidi:isolate;font-family:Assistant,sans-serif;width:100%;min-width:480px;max-width:${W}px;display:block;margin:0 auto" role="img" aria-label="תרשים אנתלפיה">
 <line x1="16" x2="16" y1="${top-14}" y2="${bot+30}" stroke="${mut}"/><text x="22" y="${top-18}" font-size="12" fill="${mut}">H ↑</text>
 ${line(40,300,0)}${lab(40,Y(0)-8,'MgSO₄(s) + 7H₂O(l)','start')}
 ${line(40,190,a)}${lab(40,Y(a)+17,'Mg²⁺ + SO₄²⁻ + 7H₂O','start')}
 ${line(220,300,c)}${lab(300,Y(c)+17,'MgSO₄·7H₂O(s)','end')}
 ${arr(70,0,a,'ΔH₁ = '+a.toFixed(1),acc,1)}
 <path d="M190 ${Y(a)} L205 ${Y(a)} L205 ${Y(c)-7}" fill="none" stroke="${acc}" stroke-width="2.5"/><path d="M199 ${Y(c)-9} L205 ${Y(c)} L211 ${Y(c)-9}" fill="${acc}"/>
 <text x="306" y="${(Y(a)+Y(c))/2+4}" font-size="12" fill="${acc}" style="font-family:'IBM Plex Mono',monospace">−ΔH₂ = ${(-b).toFixed(1)}</text>
 ${line(400,590,0)}${lab(590,Y(0)-8,'MgSO₄(s) + 7H₂O(l)','end')}
 ${line(400,590,c)}${lab(590,Y(c)+17,'MgSO₄·7H₂O(s)','end')}
 ${arr(430,0,c,'ΔHhyd = '+c.toFixed(1),wrn,1)}
 <text x="170" y="${H-8}" text-anchor="middle" font-size="13" fill="${mut}">דרך שתי ההמסות</text><text x="495" y="${H-8}" text-anchor="middle" font-size="13" fill="${mut}">התגובה המבוקשת</text></svg>`}
function bindHess(){const h=S.hess;
 document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const [key,d]=b.dataset.dir.split(':');if(h[key]!==d){h[key]=d;h.cancelOk=false;h.cancel=[];h.fbCancel=null;h.fb=null}save();rerenderHess()});
 document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const id=b.dataset.sp,i=h.cancel.indexOf(id);if(i<0)h.cancel.push(id);else h.cancel.splice(i,1);h.fbCancel=null;save();rerenderHess()});
 document.querySelectorAll('[data-expr]').forEach(b=>b.onclick=()=>{h.expr=b.dataset.expr;if(h.fb)h.fb.expr=null;save();rerenderHess()});
 const cc=$('#checkCancel');if(cc)cc.onclick=()=>{const c=h.cancel,has=x=>c.includes(x);
  if(!c.length)h.fbCancel='סמנו לפחות חלקיק אחד.';
  else if(has('anh')||has('hyd')||has('w'))h.fbCancel='חלקיק מצטמצם רק אם הוא מופיע בשני האגפים: תוצר באחת התגובות ומגיב בשנייה. בדקו שוב כל חלקיק שסימנתם.';
  else if(!(has('mg')&&has('so4')))h.fbCancel='יש חלקיק נוסף שמופיע בשני האגפים.';
  else{h.fbCancel=null;h.cancelOk=true}
  save();rerenderHess()};
 ['rev','val'].forEach(f=>{const el=$('#h_'+f);if(el)el.oninput=()=>{h[f]=el.value;save()}});
 const close=(p,q)=>p!=null&&Math.abs(p-q)<=Math.max(Math.abs(q)*0.02,0.3);
 const cr=$('#checkRev');if(cr)cr.onclick=()=>{const b=dhv('B'),rv=num(h.rev);h.fb=h.fb||{};
  h.fb.rev=rv==null?[0,'חסר ערך']:(close(rv,-b)?[1,'✓']:(close(rv,b)?[0,'כשהופכים תגובה, מה קורה לסימן של ΔH?']:[0,'היעזרו בערך של ΔH₂ שמופיע למעלה']));
  h.revOk=h.fb.rev[0]===1;save();rerenderHess()};
 const cb=$('#checkHess');if(cb)cb.onclick=()=>{const a=dhv('A'),b=dhv('B'),v=num(h.val),x=a-b;h.fb=h.fb||{};
  h.fb.expr=!h.expr?[0,'בחרו את הביטוי המתאים ל־ΔHhyd.']:(h.expr==='a'?[1,'✓']:[0,'התגובה המבוקשת היא סכום של תגובה (1) ושל תגובה <span class="f">(2*)</span>. מה ΔH של כל אחת מהן?']);
  h.fb.val=v==null?[0,'חסר ערך']:(close(v,x)?[1,'✓']:(close(v,a+b)?[0,'חברו את ΔH של תגובה <span class="f">(2*)</span>, לא של תגובה (2) המקורית']:(close(-v,x)?[0,'בדקו את הסימן']:[0,'חברו את ΔH₁ ואת ΔH של תגובה <span class="f">(2*)</span>'])));
  h.ok=h.fb.expr[0]===1&&h.fb.val[0]===1;save();rerenderHess();const d=document.getElementById('diag');if(d&&h.ok)d.scrollIntoView({behavior:'smooth',block:'start'})};
 const td=$('#toDisc');if(td)td.onclick=()=>{S.tab='disc';save();render();window.scrollTo({top:0})};
 const te=$('#toExt');if(te)te.onclick=()=>{S.tab='C';save();render();window.scrollTo({top:0})}}
function rerenderHess(){const sc=scrollY;render();scrollTo(0,sc)}

const LIT_HYD=-103;
const QS=[

 ['ב. המסת ההידראט – תהליך אנדותרמי',null,'אילו אינטראקציות יש לפרק או להחליש בגביש ההידראט, ואילו נוצרות בתמיסה? מדוע מאזן האנרגיה בהמסת ההידראט שונה מזה של המסת המלח האל־מימי?'],

 ['ד. תנאי הניסוי ומקורות שגיאה',null,'מה היה משתבש בחישוב אילו בחלק ב׳ היינו מוסיפים 50 מ״ל מים במקום 47 מ״ל? התייחסו לתנאי חוק הס.'],
 [null,null,'הכוס אינה מבודדת לחלוטין: חום עובר בין התמיסה לבין האוויר דרך דופנות כוס הקרטון ודרך לוח הקלקר המכסה אותה – ובמיוחד כשהלוח מורם – וכוס הקרטון עצמה מתחממת או מתקררת יחד עם התמיסה. כיצד זה משפיע על '+F.dT+' שנמדד בכל חלק, ועל הערך שקיבלתם ל־'+F.dHhyd+'?'],
 [null,null,'צנצנת ה־'+F.anh+' האל־מימי עמדה פתוחה כמה ימים, וחלק מהמלח קלט לחות. כיצד זה ישפיע על '+F.dH1+' שתמדדו, ועל '+F.dHhyd+' שתחשבו?'],
 [null,null,'אם נשקלה בטעות מסה שונה מהמתוכנן, האם אפשר עדיין להשתמש בתוצאות הניסוי? הסבירו.'],
 [null,null,'הערך המקובל בספרות הוא <span class="f">ΔH<sub>hyd</sub> ≈ −103 kJ/mol</span>. חשבו את הסטייה באחוזים של התוצאה שלכם, וציינו את הגורם שלדעתכם תרם לה הכי הרבה.']];
function myHyd(){return S.hess.ok?`<div class="dhs" style="margin-top:4px"><div><span>התוצאה שלכם</span><b class="f">${hydVal().toFixed(1)} kJ/mol</b></div><div><span>ערך ספרותי</span><b class="f">${LIT_HYD} kJ/mol</b></div></div>`:''}
function myExt(){if(S.calcOk.C&&S.calcOk.A)return `<div class="dhs" style="margin-top:4px"><div><span>המדידה שלכם – מלח טרי</span><b class="f">${fmtS(dhv('A'))} kJ/mol</b></div><div><span>המדידה שלכם – מלח שקלט לחות</span><b class="f">${fmtS(num(S.calc.C.dh))} kJ/mol</b></div></div>`;
 return '<span class="hint">אפשר לבדוק זאת במדידה, בלשונית "הרחבה".</span>'}
function discHTML(){return `<div class="panel"><div class="card"><h2>דיון וסיכום</h2>
 <div style="display:flex;flex-direction:column;gap:16px;margin-top:10px">${QS.map(([sec,hint,q],i)=>`${sec?`<h3${i?' style="margin-top:8px"':''}>${sec}</h3>`:''}${hint?`<p class="hint">${hint}</p>`:''}<label for="q${i}" style="display:flex;flex-direction:column;gap:6px"><span><b>${i+1}.</b> ${q}</span>${i===5?myExt():''}${i===7?myHyd():''}<textarea id="q${i}">${esc(S.disc[i]||'')}</textarea></label>`).join('')}</div>
 <p style="margin-top:14px"><b>לסיכום:</b> חוק הס מאפשר לחשב שינוי אנתלפיה של תהליך שאי אפשר למדוד ישירות, באמצעות מסלול עוקף שכל שלביו ניתנים למדידה – כל עוד המצב ההתחלתי והמצב הסופי זהים.</p>
 <div class="btns" style="margin-top:12px"><button class="b" id="toSubmit">להגשה</button></div></div></div>`}
function bindDisc(){QS.forEach((_,i)=>{const t=$('#q'+i);t.oninput=()=>{S.disc[i]=t.value;save();renderTabs()}});$('#toSubmit').onclick=()=>{S.tab='submit';save();render();window.scrollTo({top:0})}}

/* ---------- submit ---------- */
const plain=h=>h.replace(/<sub>(.*?)<\/sub>/g,'$1').replace(/<sup>(.*?)<\/sup>/g,'$1').replace(/<[^>]+>/g,'');
function reportText(){const L=[];const kindTxt={exo:'אקסותרמית',endo:'אנדותרמית'};
 L.push('ניסוי וירטואלי – אנתלפיית ההידרציה של מגנזיום גופרתי, חוק הס');L.push('שם: '+(S.name||'—')+' | בית ספר: '+(S.school||'—'));L.push('');
 L.push('תוצאות מדידה:');
 for(const k of ['A','B']){const p=S.parts[k];const lbl=PARTS[k].lbl;if(!p.resOk){L.push(`חלק ${lbl}: לא הושלם`);continue}
  L.push(`חלק ${lbl}: T התחלתית ${p.res.Ti} °C, T מרבית/מזערית ${p.res.Te} °C, ΔT ${p.res.dT} °C, מסת מים ${p.res.m} g, ${kindTxt[p.res.kind]}, מסת מלח ${p.massUsed.toFixed(2)} g`)}
 L.push('');L.push('חישובים:');
 for(const k of ['A','B']){const c=S.calc[k];L.push(`חלק ${PARTS[k].lbl}: סביבה ${c.qcal??'—'} cal = ${c.qj??'—'} J; מערכת ${c.qsys??'—'} J; n = ${c.n??'—'} mol; ΔH = ${c.dh??'—'} kJ/mol`+(S.calcOk[k]?' ✓':''))}
 L.push('');L.push('חוק הס:');
 L.push(`תגובה 1: ${S.hess.d1==='fwd'?'כמו שהיא':(S.hess.d1==='rev'?'הפוכה':'—')}; תגובה 2: ${S.hess.d2==='fwd'?'כמו שהיא':(S.hess.d2==='rev'?'הפוכה':'—')}`);
 L.push('חלקיקים שמצטמצמים: '+((S.hess.cancel||[]).map(id=>SPEC.find(x=>x[0]===id)[2]).join(', ')||'—')+(S.hess.cancelOk?' ✓':''));
 L.push(`ΔH של תגובה (2*) = ${S.hess.rev||'—'} kJ/mol`+(S.hess.revOk?' ✓':''));
 L.push('הקשר: ΔHhyd = '+(S.hess.expr?plain(EXPR.find(x=>x[0]===S.hess.expr)[1]):'—'));
 L.push(`ΔHhyd = ${S.hess.val||'—'} kJ/mol`+(S.hess.ok?' ✓':''));
 {const p=S.parts.C;if(p.resOk){L.push('');L.push('הרחבה – מלח שקלט לחות:');
  L.push(`T התחלתית ${p.res.Ti} °C, T מרבית ${p.res.Te} °C, ΔT ${p.res.dT} °C, מסת מלח ${p.massUsed.toFixed(2)} g`);
  L.push(`ΔH = ${S.calc.C.dh??'—'} kJ/mol`+(S.calcOk.C?' ✓':''))}}
 L.push('');L.push('שאלות לדיון:');
 QS.forEach((q,i)=>{L.push(`${i+1}. ${plain(q[2])}`);L.push((S.disc[i]||'').trim()||'—')});
 return L.join('\n')}
function submitHTML(){const items=[['פרטי תלמיד','intro'],['חלק א׳','A'],['חלק ב׳','B'],['חישובים','calc'],['חוק הס','hess'],['הרחבה (רשות)','C'],['שאלות דיון','disc']].map(([l,id])=>[l,id,tabDone(id)]);
 const missing=items.filter(x=>!x[2]&&x[1]!=='C');
 return `<div class="panel"><div class="card"><h2>הגשת העבודה</h2>
 <p style="margin-top:6px">הסימולציה מרכזת את כל המדידות, החישובים והתשובות שלכם בטקסט אחד. כדי להגיש, מעתיקים אותו ומדביקים במקום שבו אתם מגישים עבודות.</p>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px">${items.map(([l,id,d])=>d?`<div class="check on"><span class="mk">✓</span>${l}</div>`:`<button class="check linkish" data-go="${id}"><span class="mk"></span>${l}${id==='C'?'':' – להשלמה'}</button>`).join('')}</div>
 ${missing.length?`<div class="msg warn" style="margin-top:10px">עדיין חסר: ${missing.map(x=>x[0]).join(', ')}. לחצו על פריט כדי לעבור אליו. אפשר להגיש גם עבודה חלקית.</div>`:'<div class="msg ok" style="margin-top:10px">כל החלקים הושלמו.</div>'}
 <ol class="subst">
  <li><b>לחצו על "העתקת הסיכום".</b><button class="b go" id="copyRep" style="margin-top:8px">העתקת הסיכום</button><div id="copyMsg"></div></li>
  <li><b>פתחו את המקום שבו מגישים</b>: הודעת מייל, משימה במערכת הלמידה או מסמך.</li>
  <li><b>הדביקו</b>: במחשב <span class="f">Ctrl+V</span>, בטלפון לחיצה ארוכה ואז "הדבקה". ואז שלחו.</li>
 </ol>
 <details class="more" style="margin-top:12px"><summary>הצגת הסיכום שיועתק</summary><textarea id="rep" readonly style="min-height:260px;margin-top:8px;font-family:var(--body)">${esc(reportText())}</textarea></details>
 </div></div>`}
function bindSubmit(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.go;save();render();window.scrollTo({top:0})});
 $('#copyRep').onclick=()=>{const t=$('#rep');const done=ok=>{if(!ok)t.closest('details').open=true;$('#copyMsg').innerHTML=ok?'<div class="msg ok" style="margin-top:8px">✓ הסיכום הועתק. עכשיו עברו לשלב 2.</div>':'<div class="msg warn" style="margin-top:8px">ההעתקה האוטומטית לא עבדה כאן. הטקסט סומן למטה – העתיקו אותו בעצמכם (Ctrl+C, או לחיצה ארוכה ואז "העתקה").</div>'};
 try{navigator.clipboard.writeText(t.value).then(()=>done(true),()=>{t.focus();t.select();done(false)})}catch(e){t.focus();t.select();done(false)}}}

const _render=render;
render=function(){_render();if(S.tab==='intro')bindIntro();
 $('.mast').classList.toggle('compact',S.tab!=='intro');const nm=S.name.trim(),sc=(S.school||'').trim();$('#whoTxt').textContent=nm?nm+(sc?' · '+sc:''):''};
window.addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('resize',()=>{if(PARTS[S.tab])drawChart(S.tab)});
window.__lab={S:()=>S,stepSim,render,PARTS,expected,hydVal};
/* ---------- teacher report (optional) ---------- */
function _repDate(){try{return new Date().toLocaleDateString('he-IL')}catch(e){return ''}}
function _repLines(){const L=reportText().split('\n');L.splice(2,0,'תאריך: '+_repDate());return L}
function _repIso(t){return t.replace(/[A-Za-z0-9Δ±−+=×·(\[—][^\u0590-\u05FF,;|]*[A-Za-z0-9Δ)\]°—]/g,m=>{let lead='',tail='';const c=(x,ch)=>x.split(ch).length-1;
 while(m.endsWith(')')&&c(m,')')>c(m,'(')){tail=')'+tail;m=m.slice(0,-1)}while(m.startsWith('(')&&c(m,'(')>c(m,')')){lead+='(';m=m.slice(1)}
 return lead+(m?'<bdi dir="ltr">'+m+'</bdi>':'')+tail})}
function reportBodyHTML(){const L=_repLines();let h='',ans=false;const E=t=>_repIso(esc(t));
 L.forEach((l,i)=>{const t=l.trim();if(!t){ans=false;return}
  if(i===0){h+=`<h1>${E(t)}</h1>`;return}
  if(i<=2){h+=`<p class="rp-meta">${E(t)}</p>`;return}
  if(/:$/.test(t)&&t.length<40){h+=`<h2>${E(t.slice(0,-1))}</h2>`;ans=false;return}
  if(/^\d+\.\s/.test(t)){h+=`<p class="rp-q">${E(t)}</p>`;ans=true;return}
  h+=`<p class="${ans?'rp-a':''}">${E(t)}</p>`});
 return h}
function reportFileHTML(){return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(document.title)} – ${esc(S.name||'')}</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.55;color:#18282d}h1{font-size:1.4rem;border-bottom:2px solid #19576c;padding-bottom:6px}h2{font-size:1.1rem;color:#19576c;margin:18px 0 6px}p{margin:4px 0;unicode-bidi:plaintext}.rp-meta{font-weight:700}.rp-q{font-weight:700;margin-top:10px}.rp-a{margin-inline-start:16px;white-space:pre-wrap}</style></head><body>${reportBodyHTML()}</body></html>`}
function reportCardHTML(){return `<div class="card" id="repCard"><h2>דוח למורה (רשות)</h2>
 <p style="margin-top:6px">אם המורה ביקש דוח, אפשר לשלוח אותו מכאן בווטסאפ, או לשמור אותו כקובץ ולהעלות לפטל. אם לא ביקשו – אפשר לדלג.</p>
 <div class="btns" style="margin-top:12px"><button class="b" id="repWa">שליחה בווטסאפ</button><button class="b alt" id="repFile">הורדת הדוח כקובץ (להעלאה לפטל)</button><button class="b alt" id="repPdf">שמירה כ־PDF או הדפסה</button></div>
 <div id="repMsg"></div>
 <details class="more" style="margin-top:12px"><summary>הצגת הדוח</summary><div id="report" class="rp">${reportBodyHTML()}</div></details></div>`}
const _submitHTML0=submitHTML;
submitHTML=function(){const h=_submitHTML0();const i=h.lastIndexOf('</div>');return h.slice(0,i)+reportCardHTML()+h.slice(i)};
const _bindSubmit0=bindSubmit;
bindSubmit=function(){_bindSubmit0();
 const msg=(ok,t)=>{$('#repMsg').innerHTML=`<div class="msg ${ok?'ok':'warn'}" style="margin-top:8px">${t}</div>`};
 $('#repWa').onclick=()=>{const t=_repLines().join('\n');
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({title:document.title,text:t}).then(()=>msg(true,'✓ הדוח נשלח.'),()=>{});return}
  const w=window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');if(!w)msg(false,'החלון לא נפתח. אפשר להשתמש בכפתור "העתקת הסיכום" ולהדביק בווטסאפ.')};
 $('#repFile').onclick=()=>{try{const d=new Date(),pad=n=>String(n).padStart(2,'0');const name=KEY.replace(/-v\d+$/,'')+'-report-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.html';
  const url=URL.createObjectURL(new Blob([reportFileHTML()],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  msg(true,'✓ הקובץ נשמר בתיקיית ההורדות. אפשר להעלות אותו לפטל.')}catch(e){msg(false,'ההורדה לא עבדה כאן. נסו "שמירה כ־PDF או הדפסה".')}};
 $('#repPdf').onclick=()=>{const d=$('#report').closest('details');d.open=true;document.body.classList.add('printing-report');setTimeout(()=>{try{window.print()}catch(e){}document.body.classList.remove('printing-report')},50)};
};

render();
